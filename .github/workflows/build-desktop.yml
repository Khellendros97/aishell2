# 桌面端云端构建：macOS（arm64/x64）+ Windows（x64）。
# 手动触发（Actions → build-desktop → Run workflow）：只产 Artifacts（需登录下载，90 天有效）。
# 推送 v* tag：额外由 publish-release 汇总安装包挂到同名 GitHub Release（任何人免登录可下载）。
# 未签名/未公证：
# - macOS 首次打开报「已损坏」：xattr -dr com.apple.quarantine /Applications/AIShell.app
# - Windows SmartScreen 拦截：点「更多信息 → 仍要运行」
name: build-desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# contents: write 供 softprops/action-gh-release 创建 release 并上传安装包
permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon：macos-latest 即 arm64 镜像
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          # Intel：macos-13 已于 2025-12 退役，macos-15-intel 是最后的 x86_64 镜像（至 2027-08）
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      # 显式拉取 pi sidecar（tauri beforeBuildCommand 会再跑一次，幂等跳过；
      # 独立成步是为了下载/解压失败时日志定位直接。走 latest/download 重定向，免 API 免鉴权）
      - run: npm run fetch-pi

      - run: npm run tauri -- build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: aishell-macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 宿主即 x86_64-pc-windows-msvc，无需显式 target
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      # 与 macOS 同一脚本：win32-x64 走 pi-windows-x64.zip + PowerShell 解压
      - run: npm run fetch-pi

      # 显式拉取 Python 安装器（beforeBuildCommand 会再跑一次，幂等跳过；独立成步便于失败定位）
      - run: npm run fetch-python

      - run: npm run tauri -- build

      - uses: actions/upload-artifact@v4
        with:
          name: aishell-windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # 汇总发版：三腿产物收齐后单点创建 Release（避免双腿并发建 release 的 body 竞争）
  publish-release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # 三个 artifact 解压到同一目录（保留内部 dmg/ msi/ nsis/ 子目录结构）
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
          fail_on_unmatched_files: true
          body: |
            ## 下载

            **macOS**
            - `AIShell_${{ github.ref_name }}_aarch64.dmg`：Apple Silicon（M1/M2/M3/M4）
            - `AIShell_${{ github.ref_name }}_x64.dmg`：Intel Mac

            **Windows**
            - `AIShell_${{ github.ref_name }}_x64-setup.exe`：NSIS 安装包（推荐）
            - `AIShell_${{ github.ref_name }}_x64_zh-CN.msi`：MSI 安装包

            ## macOS 首次打开提示「已损坏」？

            应用未做苹果签名/公证，这是 Gatekeeper 对未签名应用的统一误报。拖进「应用程序」后在终端执行一次即可：

            ```bash
            xattr -dr com.apple.quarantine /Applications/AIShell.app
            ```

            ## Windows 被 SmartScreen 拦截？

            未签名应用的常见提示：点「更多信息」→「仍要运行」。
