# 桌面端云端构建：macOS（arm64/x64）+ Windows（x64）+ 云服务自动更新发布。
#
# 触发方式：
#   workflow_dispatch            — 质量门 + 构建并保留 Actions Artifacts（内部验收包）；
#                                  勾选 sign-updater 且已配置签名 Secret 时附带签名 updater 制品；
#                                  勾选 win-only 时跳过 macOS（私有仓 macOS runner 按 10 倍
#                                  费率计费，测试期只验 Windows，通过后再全量跑）
#   push srun-aishell-cloud 分支 — 质量门 + 三平台可复现构建（不发布任何渠道）
#   push v* tag                  — 质量门 + 签名构建 + GitHub Release（人工下载）
#                                  + 云服务更新 draft 上传（管理员在 ReleasePanel 核对后发布频道）
#   仓库变量 WIN_ONLY_RELEASE='true' 时，workflow_dispatch 与 tag 发布都只跑 Windows：
#   跳过 macOS、GitHub Release 只挂 win 安装包、不上传云更新 draft（complete 需 3 target）。
#   发完置回/删除该变量即可恢复全量发布。
#
# tag 构建前置（缺失时签名步骤会以明确错误失败）：
#   Secrets: TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD（updater 签名）
#            AISHELL_UPDATE_SERVER_URL / AISHELL_UPDATE_PUBLISH_TOKEN（云服务上传）
#   三处版本号一致且与 tag 相同（quality 任务 check-versions 强校验）
#
# 云服务 OAuth 注入（所有 release 构建都需要，含分支 push 路径）：
#   Secrets: AISHELL_CLIENT_ID / AISHELL_CLIENT_SECRET —— build.rs 经 option_env! 内嵌
#   二进制；缺失时 build.rs 直接 panic（0.5.2 曾静默出无云功能的包，装机后才发现）。
#   AISHELL_SERVER_URL 非敏感，直接明文写在构建任务的 env 里。
#
# 平台代码签名（未做，如实告知用户）：
# - macOS 首次打开报「已损坏」：xattr -dr com.apple.quarantine /Applications/AIShell.app
# - Windows SmartScreen 拦截：点「更多信息 → 仍要运行」
# 注意 Tauri updater 签名只解决更新包来源/完整性，不是 Authenticode/Developer ID 的替代。
name: build-desktop

on:
  workflow_dispatch:
    inputs:
      sign-updater:
        description: '生成签名 updater 制品（需已配置 TAURI_SIGNING_PRIVATE_KEY Secret）'
        type: boolean
        default: false
      win-only:
        description: '仅跑 Windows 构建（跳过 macOS，测试期省 10 倍费率的 mac 分钟数）'
        type: boolean
        default: false
  push:
    branches: ['srun-aishell-cloud']
    tags: ['v*']

# contents: write 供 softprops/action-gh-release 创建 release 并上传安装包
permissions:
  contents: write

jobs:
  # 质量门（发布指南 §2.3：tsc / cargo test / clippy -D warnings 三道全绿）
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      # quality 门同样要跑 cargo test：pi/git 两个资源都不入库，缺了 tauri-build 会因
      # resources/pi、resources/git 不存在而失败。构建走的 beforeBuildCommand 里才会拉，
      # 此处与「拉齐后再跑 test」一致地先拉取（幂等；git 资源另在 scripts/fetch-git.mjs）。
      - run: npm run fetch-pi && npm run fetch-git

      # 版本一致性（tag 构建额外校验与 tag 相同；ref 经 env 传入避免 shell 注入）
      - name: 校验版本一致（含 tag）
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/check-versions.mjs --expect "${REF_NAME#v}"

      - name: 校验版本一致
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/check-versions.mjs

      - run: npx tsc --noEmit
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build-macos:
    needs: quality
    # 跳过 macOS 的两种情形：
    #   1) workflow_dispatch 勾选 win-only（测试验收，省 10 倍费率的 mac 分钟数）
    #   2) 仓库变量 WIN_ONLY_RELEASE 为 'true' —— 允许 tag 发布也「只发 Win 包」：
    #      云服务 complete 校验要求 3 个 target 齐全，win-only 只能发 GitHub Release，
    #      本轮不上传云更新 draft（见 publish-update 门控）。
    # 变量未设置时恒真照常执行。注意：本 job 被跳过时，依赖它的 publish-*
    # 默认会被级联跳过（不是「视为成功」），publish-release 已用 result 条件显式处理。
    if: ${{ !(vars.WIN_ONLY_RELEASE == 'true' || inputs.win-only == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon：macos-latest 即 arm64 镜像
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          # Intel：macos-13 已于 2025-12 退役，macos-15-intel 是最后的 x86_64 镜像（至 2027-08）
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      AISHELL_SERVER_URL: https://aishell.srun.com:18002
      AISHELL_CLIENT_ID: ${{ secrets.AISHELL_CLIENT_ID }}
      AISHELL_CLIENT_SECRET: ${{ secrets.AISHELL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      # 显式拉取 pi sidecar（tauri beforeBuildCommand 会再跑一次，幂等跳过；
      # 独立成步是为了下载/解压失败时日志定位直接。走 latest/download 重定向，免 API 免鉴权）
      - run: npm run fetch-pi

      # 签名条件：tag 构建恒签名；手动构建需勾选 sign-updater。
      # 未签名路径用 --config 覆盖关闭 createUpdaterArtifacts（未配置私钥时 bundler 会硬失败）
      - name: 是否签名 updater 制品
        shell: bash
        env:
          SIGN_INPUT: ${{ inputs.sign-updater }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* || "$SIGN_INPUT" == "true" ]]; then
            echo "SIGN_UPDATER=true" >> "$GITHUB_ENV"
          else
            echo "SIGN_UPDATER=false" >> "$GITHUB_ENV"
          fi

      - name: 构建（签名 updater 制品）
        if: env.SIGN_UPDATER == 'true'
        run: npm run tauri -- build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 构建（跳过 updater 制品）
        if: env.SIGN_UPDATER != 'true'
        run: npm run tauri -- build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: aishell-macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  build-windows:
    needs: quality
    runs-on: windows-latest
    env:
      AISHELL_SERVER_URL: https://aishell.srun.com:18002
      AISHELL_CLIENT_ID: ${{ secrets.AISHELL_CLIENT_ID }}
      AISHELL_CLIENT_SECRET: ${{ secrets.AISHELL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 宿主即 x86_64-pc-windows-msvc，无需显式 target
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      # 与 macOS 同一脚本：win32-x64 走 pi-windows-x64.zip + PowerShell 解压
      - run: npm run fetch-pi

      # win-only（WIN_ONLY_RELEASE=true）强制走非签名路径：签名会设 TAURI_SIGNING_PRIVATE_KEY，
      # 而一旦设置该密钥，tauri 会无视 createUpdaterArtifacts:false 强制打包 updater/msi，
      # 预发布版本 0.5.3-a 仍报 msi 报错（本地无密钥时组合才通过）。
      - name: 是否签名 updater 制品
        shell: bash
        env:
          SIGN_INPUT: ${{ inputs.sign-updater }}
          WO: ${{ vars.WIN_ONLY_RELEASE }}
        run: |
          if [ "$WO" = "true" ]; then
            echo "SIGN_UPDATER=false" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* || "$SIGN_INPUT" == "true" ]]; then
            echo "SIGN_UPDATER=true" >> "$GITHUB_ENV"
          else
            echo "SIGN_UPDATER=false" >> "$GITHUB_ENV"
          fi

      # win-only（WIN_ONLY_RELEASE=true）且版本为预发布（如 0.5.3-a）时，tauri bundler
      # 对 msi 目标报「pre-release identifier must be numeric-only」。且签名/updater 路径
      # 下 tauri 会无视 --bundles nsis 强制追加 msi 打包器（实测），故需同时关闭
      # createUpdaterArtifacts 再限定 NSIS——win-only 不上传云 draft、本就不需要 updater
      # 制品。该组合已本地验证：只产 NSIS setup.exe、不触发 wix/msi。
      # 全量发布（变量未设）维持 msi+nsis、保留 updater 制品。
      - name: win-only 是否仅 NSIS（msi 拒绝预发布版本）
        shell: bash
        env:
          WO: ${{ vars.WIN_ONLY_RELEASE }}
        run: |
          if [ "$WO" = "true" ]; then
            echo 'BUNDLE_OVERRIDE=--bundles nsis --config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_ENV"
          fi

      - name: 构建（签名 updater 制品）
        if: env.SIGN_UPDATER == 'true'
        run: npm run tauri -- build $BUNDLE_OVERRIDE
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 构建（跳过 updater 制品）
        if: env.SIGN_UPDATER != 'true'
        shell: bash
        run: npm run tauri -- build --config '{"bundle":{"createUpdaterArtifacts":false}}' $BUNDLE_OVERRIDE

      - uses: actions/upload-artifact@v4
        with:
          name: aishell-windows-x64
          # nsis/ 全量上传：updater 制品形态随 CLI 版本可能是 *-setup.exe(+.sig) 或其 .zip
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

  # 汇总发版：三腿产物收齐后单点创建 Release（避免双腿并发建 release 的 body 竞争）
  publish-release:
    needs: [build-macos, build-windows]
    # win-only（build-macos 被跳过）时，GH Actions 会把「跳过的 needs job」级联跳过
    # 本 job（默认 if 下直接不建 Release）。不能改用 always()（build-windows 失败也会建）。
    # 精确条件：win 构建成功 且 mac 构建成功或跳过。
    if: ${{ startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.build-windows.result == 'success' && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # 三个 artifact 解压到同一目录（保留内部 dmg/ msi/ nsis/ 子目录结构）
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # fail 关闭：win-only(tag 设 WIN_ONLY_RELEASE=true)时只有 msi/exe、无 dmg；
          # 全量发布时 dmg/msi/exe 均存在，关闭无副作用。
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
          fail_on_unmatched_files: false
          body: |
            ## 下载

            **macOS**
            - `AIShell_${{ github.ref_name }}_aarch64.dmg`：Apple Silicon（M1/M2/M3/M4）
            - `AIShell_${{ github.ref_name }}_x64.dmg`：Intel Mac

            **Windows**
            - `AIShell_${{ github.ref_name }}_x64-setup.exe`：NSIS 安装包（推荐）
            - `AIShell_${{ github.ref_name }}_x64_zh-CN.msi`：MSI 安装包

            ## macOS 首次打开提示「已损坏」？

            应用未做苹果签名/公证，这是 Gatekeeper 对未签名应用的统一误报。拖进「应用程序」后在终端执行一次即可：

            ```bash
            xattr -dr com.apple.quarantine /Applications/AIShell.app
            ```

            ## Windows 被 SmartScreen 拦截？

            未签名应用的常见提示：点「更多信息」→「仍要运行」。

  # 云服务更新发布（自动更新开发文档 §8.3）：三平台签名制品上传为 draft，
  # complete 通过后等待管理员在 ReleasePanel 核对并发布频道。仅 tag 触发。
  publish-update:
    needs: [build-macos, build-windows]
    # win-only（WIN_ONLY_RELEASE=true）时不上传云更新 draft：云服务 complete 校验要求
    # 3 个 target（win + darwin×2）齐全，只传 Windows 会被服务端拒绝。
    if: ${{ startsWith(github.ref, 'refs/tags/') && vars.WIN_ONLY_RELEASE != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 两个 macOS 腿的 updater 制品同名（AIShell.app.tar.gz），必须分开下载按目录区分
      - uses: actions/download-artifact@v4
        with:
          name: aishell-windows-x64
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: aishell-macos-arm64
          path: dist/arm
      - uses: actions/download-artifact@v4
        with:
          name: aishell-macos-x64
          path: dist/x64

      # 更新说明 = 带注释 tag 的完整信息（git tag -a 时填写的发布说明）
      - name: 提取 tag 发布说明
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.txt

      - name: 上传更新制品到云服务
        shell: bash
        env:
          AISHELL_UPDATE_SERVER_URL: ${{ secrets.AISHELL_UPDATE_SERVER_URL }}
          AISHELL_UPDATE_PUBLISH_TOKEN: ${{ secrets.AISHELL_UPDATE_PUBLISH_TOKEN }}
        run: |
          # Windows updater 制品：优先裸 NSIS exe，其次 bundler 打包的 zip 形态
          WIN=$(ls dist/win/nsis/*-setup.exe 2>/dev/null | head -1 || true)
          if [ -z "$WIN" ]; then
            WIN=$(ls dist/win/nsis/*-setup*.zip 2>/dev/null | head -1 || true)
          fi
          ARM=$(ls dist/arm/macos/*.app.tar.gz 2>/dev/null | head -1 || true)
          X64=$(ls dist/x64/macos/*.app.tar.gz 2>/dev/null | head -1 || true)
          bash scripts/publish-update.sh "$WIN" "$ARM" "$X64" "${GITHUB_REF_NAME#v}" release-notes.txt "$GITHUB_SHA"
