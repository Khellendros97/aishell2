# macOS 云端构建：手动触发（Actions → build-macos → Run workflow）或推送 v* tag。
# 产出 Apple Silicon（arm64）与 Intel（x64）两个 .dmg/.app，在运行页底部 Artifacts 下载。
# 未签名/未公证：下载到 Mac 首次打开会被 Gatekeeper 拦，去「系统设置 → 隐私与安全性 →
# 仍要打开」，或执行 xattr -dr com.apple.quarantine /Applications/AIShell.app。
name: build-macos

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# contents: write 供 softprops/action-gh-release 创建 release 并上传 dmg
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon：macos-latest 即 arm64 镜像
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          # Intel：macos-13 已于 2025-12 退役，macos-15-intel 是最后的 x86_64 镜像（至 2027-08）
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      # 显式拉取 pi sidecar（tauri beforeBuildCommand 会再跑一次，幂等跳过；
      # 独立成步是为了下载/解压失败时日志定位直接。走 latest/download 重定向，免 API 免鉴权）
      - run: npm run fetch-pi

      - run: npm run tauri -- build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: aishell-macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error

      # tag 触发时把 dmg 挂到对应 GitHub Release（任何人免登录可下载；Artifacts 需登录且 90 天过期）
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
          body: |
            ## 下载

            - **AIShell_${{ github.ref_name }}_aarch64.dmg**：Apple Silicon（M1/M2/M3/M4）
            - **AIShell_${{ github.ref_name }}_x64.dmg**：Intel Mac

            ## 安装后首次打开提示「已损坏」？

            应用未做苹果签名/公证，这是 Gatekeeper 对未签名应用的统一误报。拖进「应用程序」后在终端执行一次即可：

            ```bash
            xattr -dr com.apple.quarantine /Applications/AIShell.app
            ```
