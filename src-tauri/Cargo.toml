[package]
name = "aishell"
version = "0.7.9"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aishell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 内置浏览器 localhtml 自定义协议（本地 HTML 文件加载）：协议响应类型 + 路径百分号解码
http = "1"
percent-encoding = "2"
# devtools: release 安装版也保留 F12 开发者工具，便于现场排查（如 pi 资源布局问题）
# unstable: 主窗口内嵌子 webview（内置浏览器面板）所需 —— tauri 2.11 的
#   WebviewBuilder / Window::add_child 均受该 feature 门控
# default-features=false 剔除 common-controls-v6：该 feature 只切换 muda 内部错误弹窗的
# TaskDialog 实现（v6 独占符号）；应用二进制的 comctl32 v6 清单由 tauri-build 无条件嵌入、
# 外观不受影响。但启用后 lib 单测二进制（无嵌入清单）会因加载 v5 comctl32 报
# STATUS_ENTRYPOINT_NOT_FOUND，故必须关闭。
tauri = { version = "2", default-features = false, features = [
  "devtools",
  "unstable",
  "wry",
  "compression",
  "dynamic-acl",
  "x11",
  "dbus",
] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
russh = { version = "0.62.5", default-features = false, features = ["ring", "flate2", "rsa", "async-trait"] }
russh-sftp = "2.3.0"
russh-keys = "0.49.2"
keyring = "4.1.6"
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.91"
futures = "0.3.33"
tauri-plugin-dialog = "2.7.2"
base64 = "0.22"
# 智能审批：直连 LLM API 判定操作是否危险（不走 pi）
reqwest = { version = "0.12", features = ["json"] }
# 输出脱敏与凭据提取前置规则（redact / smart_approval）
regex = "1"
# 会话标题按 Unicode 字素截断，避免中文/emoji 被截断成半个字符
unicode-segmentation = "1"
# 远程文件暂存 blob 内容寻址与大文件行级 diff（staging.rs）
sha2 = "0.10"
hex = "0.4"
similar = "2.7"
# 生成 SSH 密钥对（ssh-key 0.7 的 random 要求 rand_core 0.10 的 CryptoRng）
rand = "0.10"
# Skill 系统 frontmatter 解析（serde_yaml 已归档，采用维护中的 serde_yaml_ng）
serde_yaml_ng = "0.9.36"
# MCP 服务端（Streamable HTTP，仅绑定 127.0.0.1）：hyper 1 已在依赖树（reqwest 带入），
# 加为直接依赖复用既有版本，无新增编译产物
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
http-body-util = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# WebView2 设置（禁用浏览器快捷键，避免劫持终端 Ctrl+Shift+C/V）；版本与 wry 对齐
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

# 离线 vendor：hyper 的 server feature 依赖 crates.io 的 httpdate，构建环境无外网时
# 无法下载，以 vendor/httpdate（本仓库自写的最小实现，API 兼容）本地替换。
[patch.crates-io]
httpdate = { path = "vendor/httpdate" }

