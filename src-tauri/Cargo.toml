[package]
name = "aishell"
version = "0.2.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aishell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: release 安装版也保留 F12 开发者工具，便于现场排查（如 pi 资源布局问题）
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
russh = { version = "0.62.5", default-features = false, features = ["ring", "flate2", "rsa", "async-trait"] }
russh-sftp = "2.3.0"
russh-keys = "0.49.2"
keyring = "4.1.6"
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.91"
futures = "0.3.33"
tauri-plugin-dialog = "2.7.2"
base64 = "0.22"
# 智能审批：直连 LLM API 判定操作是否危险（不走 pi）
reqwest = { version = "0.12", features = ["json"] }
# 输出脱敏与凭据提取前置规则（redact / smart_approval）
regex = "1"
# 远程文件暂存 blob 内容寻址（staging.rs）
sha2 = "0.10"
hex = "0.4"
# Skill 系统 frontmatter 解析（serde_yaml 已归档，采用维护中的 serde_yaml_ng）
serde_yaml_ng = "0.9.36"

# WebView2 设置（禁用浏览器快捷键，避免劫持终端 Ctrl+Shift+C/V）；版本与 wry 对齐
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

